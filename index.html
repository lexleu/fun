<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大肥鱼的第一款小游戏 · 贪吃蛇</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#0f1420;color:#dbe6f2;font-family:system-ui,"Microsoft YaHei",sans-serif;gap:14px;touch-action:none;}
  canvas{background:#131a28;border-radius:10px;box-shadow:0 0 0 1px #263149,0 12px 40px #0008;max-width:96vw;height:auto;}
  #hud{font-size:15px;letter-spacing:.5px;opacity:.85}
  #tip{font-size:12px;opacity:.45}
</style>
</head>
<body>
<canvas id="c" width="416" height="728"></canvas>
<div id="hud">分数 <b id="score">0</b> 最高 <b id="best">0</b></div>
<div id="tip">方向键 / WASD 移动　空格重开</div>

<script>
// ===== 1. 常量：改这几个数就能改手感 =====
const CELL = 26;            // 每格 30 像素（我决定听大肥鱼的，好好写注释）
const COLS = 16, ROWS = 28; // 30×20 的格子
let SPEED = 250;          // 每走一步隔多久（毫秒）。数字越小越快

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

// ===== 2. 游戏状态 =====
let snake, dir, nextDir, food, score, dead, acc, lastTime, enemy, stepCount;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; // 头在第一个
  dir = {x:1,y:0};        // 往右
  nextDir = dir;
  food = randomFood();
  score = 0;
  dead = false;
  acc = 0;
  lastTime = performance.now();
  SPEED = 250;            // 每局开始把速度复原，不然会一局比一局快
  enemy={x:13,y:4,dx:1,dy:0};   //位置和方向
  stepCount=0;
  scoreEl.textContent = '0';
  bestEl.textContent = loadBest();
}



//读存档.第一次打开是 null ，初始数字为0
 function loadBest() {
   return Number(localStorage.getItem('snake-best') || 0);
}
 function saveBest(v) {
   localStorage.setItem('snake-best',String(v));
}

// 在空格子里随机放一个食物
function randomFood() {
  while (true) {
    const p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
    if (!snake.some(s => s.x===p.x && s.y===p.y)) return p;
  }
}
// 怪每走一格；撞墙就掉头
function moveEnemy(){
  //1.先算：怪和蛇头差了几格
  const dx = snake[0].x- enemy.x;
  const dy = snake[0].y- enemy.y;

  //2.试着朝蛇头方向走一格
  const tryStep = (sx,sy) =>{
     const nx = enemy.x + sx, ny = enemy.y + sy;
     if (nx<0 || nx >= COLS || ny < 0 || ny>= ROWS) return false;
     enemy.x = nx;
     enemy.y = ny;
     return true;
};

  //3.先走差距大的方向  
  const preferX = Math.abs(dx) >= Math.abs(dy);
  const plan =preferX
    ?[[Math.sign(dx),0],[0, Math.sign(dy)]]
    :[[0,Math.sign(dy)],[Math.sign(dx),0]];

  for (const [sx,sy] of plan) {
    if((sx || sy) && tryStep(sx,sy))return; //youfangxiancaizou
  }    
 //两个方向都堵死时候不动
}

//死的时候判断要不要存档
function die() {
   dead=true;
    if(score > loadBest()) { //破纪录才存
       saveBest(score);
       bestEl.textContent = score;
   }
}

// ===== 3. 每一步：蛇往前挪一格 =====
function step() {
  stepCount++;
  if (stepCount % 3 === 0) moveEnemy();
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }
  // 撞自己
  if (snake.some(s => s.x===head.x && s.y===head.y)) { die(); return; }

  snake.unshift(head);                 // 新头加在最前面
  if (head.x===food.x && head.y===food.y) {
    score++;                           // 吃到：不删尾巴，等于变长
    SPEED = Math.max(60, SPEED - 8);
    scoreEl.textContent = score;
    food = randomFood();
  } else {
    snake.pop();                       // 没吃到：删尾巴，长度不变
  }

  // 怪和头撞在一起就死（放在最后，吃到和没吃到都检查）
  if (enemy.x === snake[0].x && enemy.y === snake[0].y) die();
}

// ===== 4. 画出来 =====
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 淡淡的网格
  ctx.strokeStyle = '#1b2436';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, ROWS*CELL); ctx.stroke();
  }
  for (let j = 1; j < ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(COLS*CELL, j*CELL); ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#ff9f6b';
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL*0.32, 0, Math.PI*2);
  ctx.fill();

  // 蛇：头亮一点
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7ad4ff' : '#3f8ec4';
    ctx.fillRect(s.x*CELL + 2, s.y*CELL + 2, CELL - 4, CELL - 4);
  });
    ctx.fillStyle = '#ff5c7a';
    ctx.fillRect(enemy.x*CELL + 3,enemy.y*CELL + 3, CELL - 6, CELL-6);

  // 结束提示
  if (dead) {
    ctx.fillStyle = '#000a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#dbe6f2';
    ctx.textAlign = 'center';
    ctx.font = '20px system-ui,"Microsoft YaHei"';
    ctx.fillText('撞了！得分 ' + score, canvas.width/2, canvas.height/2 - 6);
    ctx.font = '14px system-ui,"Microsoft YaHei"';
    ctx.fillStyle = '#8fa3bd';
    ctx.fillText('按空格重开', canvas.width/2, canvas.height/2 + 24);
  }
}

// ===== 5. 主循环：按时间累积，到点走一步 =====
function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  if (!dead) {
    acc += dt;
    while (acc >= SPEED) { acc -= SPEED; step(); if (dead) break; }
  }
  draw();
  requestAnimationFrame(loop);
}

// ===== 6. 键盘 =====
const KEYMAP = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
};
document.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (e.code === 'Space') { e.preventDefault(); reset(); return; }
  const d = KEYMAP[k];
  if (!d) return;
  e.preventDefault();
  // 不能 180 度掉头
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
});

//======== 7.手机滑动 ==========
let touchStart =null;

canvas.addEventListener('touchstart', e =>{
   if(dead) { reset(); return; }  //死了就摸一下重开
   const t = e.changedTouches[0];
   touchStart = {x:t.clientX, y: t.clientY};
   e.preventDefault();
 }, {passive:false});

canvas.addEventListener('touchend', e=>{
   if(!touchStart) return;
   const t = e.changedTouches[0];
   const dx = t.clientX - touchStart.x;
   const dy = t.clientY - touchStart.y;
   touchStart = null;

    if (Math.abs(dx) < 20 && Math.abs(dy) <20) return;//太短当没动
    
  const  d = Math.abs(dx) >= Math.abs(dy)
       ?{x: Math.sign(dx), y:0}
       :{x:0,y: Math.sign(dy)};

   if(d.x === -dir.x && d.y === -dir.y) return;             //不能180°掉头
  nextDir = d;
},{passive:false});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
